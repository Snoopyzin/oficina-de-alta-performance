<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico 360° Diesel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">

<style>
/* =========================================================
   Layout: placa de oficina no topo; trilho de departamentos
   à esquerda + ficha do departamento à direita; painel do
   mentor em abas.
   ========================================================= */

/* ---------- Tokens (tema claro / escuro) ---------- */
:root {
  --bg: #EDEFF1;
  --surface: #FFFFFF;
  --sunk: #F5F6F7;
  --ink: #1A2026;
  --muted: #5A6570;
  --line: #D2D7DC;

  --steel: #24394A;
  --steel-ink: #F2F4F5;
  --accent: #E08A2E;
  --accent-ink: #9A5210;
  --accent-soft: #FBEBD8;

  --good: #2F8A55;
  --warn: #C98A12;
  --bad: #C2452F;

  --f-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161A;
    --surface: #1A2127;
    --sunk: #151B20;
    --ink: #E5E9EC;
    --muted: #93A0AA;
    --line: #2C363E;

    --steel: #1F3343;
    --steel-ink: #E9EEF1;
    --accent: #E8973A;
    --accent-ink: #F2B670;
    --accent-soft: #3A2A17;

    --good: #4FB37A;
    --warn: #E0A63A;
    --bad: #E06A55;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #11161A;
  --surface: #1A2127;
  --sunk: #151B20;
  --ink: #E5E9EC;
  --muted: #93A0AA;
  --line: #2C363E;

  --steel: #1F3343;
  --steel-ink: #E9EEF1;
  --accent: #E8973A;
  --accent-ink: #F2B670;
  --accent-soft: #3A2A17;

  --good: #4FB37A;
  --warn: #E0A63A;
  --bad: #E06A55;
  color-scheme: dark;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.55;
  margin: 0;
}

.wrap {
  max-width: 1180px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 0 64px;
}

/* ---------- Cabeçalho (placa) ---------- */
header.placa {
  background: var(--steel);
  color: var(--steel-ink);
  padding-block: 22px 18px;
  border-bottom: 4px solid var(--accent);
}

header.placa .wrap {
  padding-block: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 12px 24px;
  align-items: flex-end;
  justify-content: space-between;
}

.marca {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.marca small {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  opacity: .75;
}

.marca h1 {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(28px, 5vw, 40px);
  line-height: 1;
  margin: 0;
  letter-spacing: .01em;
  text-transform: uppercase;
  text-wrap: balance;
}

.marca h1 span { color: var(--accent); }

.marca .logo {
  display: block;
  height: clamp(84px, 16vw, 120px);
  width: auto;
  max-width: 100%;
  border-radius: 6px;
}

.status {
  font-family: var(--f-mono);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  opacity: .9;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--muted);
}
.dot.ok   { background: var(--good); }
.dot.busy { background: var(--warn); }
.dot.err  { background: var(--bad); }

/* Abas (visíveis só para o dono) */
.abas {
  display: flex;
  gap: 4px;
  margin-top: 18px;
}

.abas button {
  font: 600 13px var(--f-body);
  letter-spacing: .06em;
  text-transform: uppercase;
  background: transparent;
  color: var(--steel-ink);
  border: 1px solid rgba(255, 255, 255, .25);
  padding: 8px 14px;
  border-radius: 4px;
  cursor: pointer;
  opacity: .8;
}

.abas button[aria-selected="true"] {
  background: var(--accent);
  color: #1A1208;
  border-color: var(--accent);
  opacity: 1;
}

.aviso {
  margin-top: 18px;
  background: var(--accent-soft);
  border: 1px solid var(--accent);
  color: var(--ink);
  padding: 12px 14px;
  border-radius: 6px;
  font-size: 14px;
}

/* ---------- Formulário: trilho + ficha ---------- */
.layout {
  display: grid;
  grid-template-columns: 270px minmax(0, 1fr);
  gap: 28px;
  margin-top: 24px;
  align-items: start;
}

nav.trilho {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 16px);
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.prog-total {
  margin-bottom: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.prog-total b {
  font-family: var(--f-display);
  font-size: 22px;
  letter-spacing: .02em;
}

.barra {
  height: 6px;
  background: var(--line);
  border-radius: 3px;
  overflow: hidden;
}

.barra i {
  display: block;
  height: 100%;
  background: var(--accent);
  width: 0;
  transition: width .3s;
}

.dep {
  display: grid;
  grid-template-columns: 30px 1fr auto;
  gap: 8px;
  align-items: center;
  text-align: left;
  background: transparent;
  border: 0;
  border-left: 3px solid transparent;
  padding: 8px 10px;
  color: var(--ink);
  font: inherit;
  font-size: 14px;
  cursor: pointer;
  border-radius: 0 4px 4px 0;
}

.dep:hover { background: var(--surface); }

.dep[aria-current="true"] {
  background: var(--surface);
  border-left-color: var(--accent);
  font-weight: 600;
}

.dep .n,
.dep .c {
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--muted);
}

.dep .c { font-variant-numeric: tabular-nums; }
.dep .c.full { color: var(--good); }

.ficha {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: clamp(18px, 3vw, 32px);
  min-width: 0;
}

.ficha-top {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 22px;
}

.eyebrow {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent-ink);
}

.ficha h2 {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: clamp(26px, 4vw, 34px);
  line-height: 1.05;
  margin: 0;
  text-transform: uppercase;
  letter-spacing: .01em;
  text-wrap: balance;
}

.ficha-top p {
  margin: 0;
  color: var(--muted);
  max-width: 62ch;
}

/* ---------- Perguntas e campos ---------- */
.perguntas {
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.q {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 760px;
}

.q label.t,
.q .t {
  font-weight: 600;
  font-size: 15px;
}

.q .h {
  font-size: 13px;
  color: var(--muted);
  margin-top: -4px;
}

input[type=text],
input[type=number],
textarea,
select {
  width: 100%;
  font: inherit;
  color: var(--ink);
  background: var(--sunk);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 12px;
}

textarea {
  min-height: 92px;
  resize: vertical;
}

input:focus-visible,
textarea:focus-visible,
select:focus-visible,
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Múltipla escolha */
.checks {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.checks label {
  display: flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--sunk);
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 14px;
  cursor: pointer;
}

.checks label:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.checks input { accent-color: var(--accent); }

/* Nota de 0 a 10 */
.nota {
  background: var(--sunk);
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 16px;
}

.escala {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.escala button {
  width: 40px;
  height: 40px;
  font: 500 14px var(--f-mono);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  border-radius: 6px;
  cursor: pointer;
}

.escala button[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: #1A1208;
}

.escala-legenda {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  max-width: 494px;
}

/* Rodapé da ficha, botões e mensagens */
.rodape-ficha {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: space-between;
  margin-top: 30px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}

.btn {
  font: 600 14px var(--f-body);
  padding: 11px 18px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}

.btn.prim {
  background: var(--accent);
  border-color: var(--accent);
  color: #1A1208;
}

.btn.steel {
  background: var(--steel);
  border-color: var(--steel);
  color: var(--steel-ink);
}

.btn:disabled {
  opacity: .45;
  cursor: default;
}

.msg {
  font-size: 14px;
  margin-top: 12px;
}
.msg.err { color: var(--bad); }
.msg.ok  { color: var(--good); }

/* ---------- Painel do mentor ---------- */
.painel {
  margin-top: 24px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.resumo {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: stretch;
}

.resumo-acao {
  display: flex;
  align-items: center;
}

.kpi {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px 18px;
  min-width: 150px;
  flex: 1;
}

.kpi b {
  display: block;
  font-family: var(--f-display);
  font-size: 34px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.kpi span {
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
}

.bloco {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 20px;
  min-width: 0;
}

.bloco h3 {
  font-family: var(--f-display);
  font-size: 22px;
  text-transform: uppercase;
  margin: 0 0 4px;
  letter-spacing: .02em;
}

.bloco > p {
  margin: 0 0 14px;
  color: var(--muted);
  font-size: 14px;
}

.rolar { overflow-x: auto; }

table {
  border-collapse: collapse;
  width: 100%;
  font-size: 14px;
}

th, td {
  text-align: left;
  padding: 9px 10px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
  white-space: nowrap;
}

th {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
  font-weight: 600;
}

td.num,
th.num {
  text-align: center;
  font-family: var(--f-mono);
  font-variant-numeric: tabular-nums;
}

td.num-pequeno { font-size: 12px; }
td small { display: block; color: var(--muted); font-size: 13px; }

tr.linha { cursor: pointer; }
tr.linha:hover td { background: var(--sunk); }

/* Células de nota: b = baixa, w = média, g = alta, v = vazia */
.cel {
  display: inline-block;
  min-width: 30px;
  padding: 3px 6px;
  border-radius: 4px;
  font-weight: 500;
}
.cel.b { background: color-mix(in srgb, var(--bad) 22%, transparent); }
.cel.w { background: color-mix(in srgb, var(--warn) 24%, transparent); }
.cel.g { background: color-mix(in srgb, var(--good) 22%, transparent); }
.cel.v { color: var(--muted); }

.pill {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: 3px 8px;
  border-radius: 10px;
  border: 1px solid var(--line);
}
.pill.env { border-color: var(--good); color: var(--good); }
.pill.ras { border-color: var(--warn); color: var(--warn); }

.vazio {
  padding: 28px 8px;
  color: var(--muted);
  text-align: center;
}

/* Detalhe de um mentorado */
.detalhe-top {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  align-items: flex-start;
  justify-content: space-between;
}

.detalhe-id {
  min-width: 0;
  flex: 1 1 260px;
}

.detalhe-id p {
  margin: 0;
  color: var(--muted);
}

.detalhe-top h3 { font-size: 28px; }

.radar {
  max-width: 420px;
  width: 100%;
}

.radar svg {
  width: 100%;
  height: auto;
  display: block;
}

.resp-sec { margin-top: 22px; }

.resp-sec h4 {
  font-family: var(--f-display);
  font-size: 19px;
  text-transform: uppercase;
  margin: 0 0 8px;
  color: var(--accent-ink);
  letter-spacing: .03em;
}

.resp {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
  gap: 6px 18px;
  padding: 9px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}

.resp .p { color: var(--muted); }

.resp .a {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.resp .a.vz { color: var(--muted); }

/* ---------- Responsivo e movimento reduzido ---------- */
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }

  nav.trilho {
    position: static;
    flex-direction: row;
    overflow-x: auto;
    gap: 6px;
    padding-bottom: 6px;
  }

  .prog-total { display: none; }

  .dep {
    grid-template-columns: auto auto;
    border-left: 0;
    border-bottom: 3px solid transparent;
    border-radius: 4px 4px 0 0;
    white-space: nowrap;
    background: var(--surface);
  }

  .dep .n { display: none; }
  .dep[aria-current="true"] { border-bottom-color: var(--accent); }

  .resp { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>

<body>

<header class="placa">
  <div class="wrap">
    <div class="marca">
      <small>Mentoria de alta performance · Linha diesel pesado</small>
      <h1 class="logo-h1"><img class="logo" src="logo.png" alt="Oficina de Alta Performance — Desenvolvendo oficinas de sucesso"></h1>
    </div>

    <div class="status" id="status">
      <i class="dot" id="statusDot"></i>
      <span id="statusTxt">Conectando…</span>
    </div>

    <div class="abas" id="abas" role="tablist" hidden>
      <button role="tab" id="abaForm" aria-selected="true">Formulário</button>
      <button role="tab" id="abaPainel" aria-selected="false">Respostas dos mentorados</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="aviso" id="avisoDono" hidden>
    Esta é a tela que seus mentorados veem. Cada um enxerga apenas as próprias respostas; só você vê todas, na aba “Respostas dos mentorados”.
  </div>
  <div class="aviso" id="avisoLocal" hidden></div>

  <section id="vistaForm">
    <div class="layout">
      <nav class="trilho" id="trilho" aria-label="Departamentos">
        <div class="prog-total">
          <b id="progTxt">0% preenchido</b>
          <div class="barra"><i id="progBar"></i></div>
        </div>
      </nav>
      <div class="ficha" id="ficha"></div>
    </div>
  </section>

  <section id="vistaPainel" class="painel" hidden></section>
</main>

<script>
/* =========================================================
   1. DADOS DO QUESTIONÁRIO
   Cada seção tem: id, t (título), curto (rótulo), intro e qs
   (perguntas). Tipos de pergunta: text, number, select,
   textarea, checks e nota (0 a 10, entra no radar).
   ========================================================= */

const AREAS_OPC=["Estratégia e liderança","Comercial e atendimento","Oficina e produção","Peças e estoque","Financeiro e precificação","Pessoas e equipe","Processos e indicadores","Tecnologia e sistemas","Jurídico, segurança e meio ambiente","Mercado e concorrência"];
const NOTA = (area)=>({id:"nota",tipo:"nota",t:`De 0 a 10, que nota você dá hoje para ${area}?`,h:"Seja sincero: a nota serve para comparar a sua percepção com o que vamos levantar juntos."});
const SECOES=[
 {id:"empresa",t:"Identificação da empresa",curto:"Empresa",intro:"Dados básicos para conhecer a oficina, a estrutura física e o tipo de serviço que vocês fazem.",qs:[
  {id:"nome",tipo:"text",t:"Seu nome completo"},
  {id:"cargo",tipo:"text",t:"Seu cargo ou função na empresa"},
  {id:"empresa",tipo:"text",t:"Nome da oficina (nome fantasia)"},
  {id:"cidade",tipo:"text",t:"Cidade / Estado"},
  {id:"fundacao",tipo:"number",t:"Ano de fundação"},

  {id:"especialidades",tipo:"checks",t:"Serviços que vocês oferecem",op:["Motor","Injeção eletrônica / bomba","Câmbio e transmissão","Diferencial","Freios e pneumática","Suspensão e direção","Elétrica","Ar-condicionado","Arla / pós-tratamento","Funilaria e pintura","Retífica","Socorro / guincho","Venda de peças balcão","Implementos e carretas","Linha amarela / agrícola"]},
  {id:"marcas",tipo:"textarea",t:"Quais marcas e modelos vocês mais atendem?",h:"Ex.: Scania, Volvo, Mercedes-Benz, VW/MAN, Iveco, DAF, máquinas agrícolas ou de construção."},
  {id:"historia",tipo:"textarea",t:"Conte brevemente a história da empresa",h:"Como começou, marcos importantes, momentos difíceis e o que mudou nos últimos anos."},

 ]},
 {id:"estrategia",t:"Dono, estratégia e liderança",curto:"Estratégia",intro:"Como o dono ocupa o tempo, para onde a empresa está indo e quanto ela depende de você.",qs:[
  NOTA("a estratégia e a sua liderança"),
  {id:"dia",tipo:"textarea",t:"Como é o seu dia típico?",h:"Quanto do seu tempo vai para a ferramenta, para atender cliente, para resolver problema e para pensar no negócio?"},
  {id:"visao",tipo:"textarea",t:"Onde você quer que a empresa esteja daqui a 3 a 5 anos?"},
  {id:"metas",tipo:"textarea",t:"A empresa tem metas escritas? Quais são e como você acompanha?"},
  {id:"diferencial",tipo:"textarea",t:"Por que o cliente escolhe você e não o concorrente?"},
  {id:"dependencia",tipo:"textarea",t:"Quais decisões só você toma hoje? O que trava se você ficar 15 dias fora?"},
  {id:"braco",tipo:"textarea",t:"Você tem um braço direito ou pessoa de confiança? Existe plano de sucessão?"},
  {id:"dor",tipo:"textarea",t:"O que mais tira o seu sono hoje no negócio?"}
 ]},
 {id:"comercial",t:"Comercial, atendimento e marketing",curto:"Comercial",intro:"Da chegada do cliente ao pós-venda: como a oficina capta, orçamenta, converte e fideliza.",qs:[
  NOTA("o comercial e o atendimento"),

const AREAS_RADAR = SECOES.filter(s => s.qs.some(q => q.tipo === "nota"));
const TOTAL = SECOES.reduce((n, s) => n + s.qs.length, 0);


/* =========================================================
   2. ESTADO E UTILITÁRIOS
   ========================================================= */

const LS_KEY = "diag360-rascunho";

let st = { respostas: {}, status: "rascunho" };   // rascunho local / espelho do doc remoto
let atual = 0;                                    // índice do departamento aberto
let db = null, uid = null;
let souDono = false, podeGravar = true;
let salvando = false, pendente = false, timer = null;

// Painel do mentor
let lista = [], selecionado = null;

try {
  const r = JSON.parse(localStorage.getItem(LS_KEY) || "null");
  if (r && r.respostas) st = r;
} catch (e) {}

const $ = s => document.querySelector(s);

const ESC_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ESC_MAP[c]);

const key = (s, q) => s.id + "." + q.id;

function preenchido(v) {
  if (Array.isArray(v)) return v.length > 0;
  return v !== undefined && v !== null && String(v).trim() !== "";
}

function contSec(s, resp) {
  return s.qs.filter(q => preenchido((resp || st.respostas)[key(s, q)])).length;
}

function progresso(resp) {
  let n = 0;
  SECOES.forEach(s => n += contSec(s, resp));
  return Math.round(n / TOTAL * 100);
}

function status(txt, cls) {
  $("#statusTxt").textContent = txt;
  $("#statusDot").className = "dot " + (cls || "");
}

function salvarLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(st)); } catch (e) {}
}


/* =========================================================
   3. FORMULÁRIO
   ========================================================= */

function campoNota(q, k, v, fid, dica) {
  let botoes = "";
  for (let i = 0; i <= 10; i++) {
    botoes += `<button type="button" data-k="${k}" data-v="${i}" aria-pressed="${v === i}">${i}</button>`;
  }
  return `
    <div class="q nota" role="group" aria-labelledby="${fid}">
      <div class="t" id="${fid}">${esc(q.t)}</div>
      ${dica}
      <div class="escala">${botoes}</div>
      <div class="escala-legenda"><span>0 · inexistente</span><span>10 · referência no mercado</span></div>
    </div>`;
}

function campoChecks(q, k, v, fid, dica) {
  const sel = Array.isArray(v) ? v : [];
  const opcoes = q.op.map((o, i) => `
    <label>
      <input type="checkbox" id="${fid}_${i}" data-k="${k}" value="${esc(o)}" ${sel.includes(o) ? "checked" : ""}>
      ${esc(o)}
    </label>`).join("");
  return `
    <div class="q" role="group" aria-labelledby="${fid}">
      <div class="t" id="${fid}">${esc(q.t)}</div>
      ${dica}
      <div class="checks">${opcoes}</div>
    </div>`;
}

function campo(s, q) {
  const k = key(s, q);
  const v = st.respostas[k];
  const fid = "q_" + s.id + "_" + q.id;
  const dica = q.h ? `<div class="h">${esc(q.h)}</div>` : "";

  if (q.tipo === "nota")   return campoNota(q, k, v, fid, dica);
  if (q.tipo === "checks") return campoChecks(q, k, v, fid, dica);

  let input;
  if (q.tipo === "textarea") {
    input = `<textarea id="${fid}" data-k="${k}">${esc(v)}</textarea>`;
  } else if (q.tipo === "select") {
    const opcoes = q.op.map(o => `<option ${v === o ? "selected" : ""}>${esc(o)}</option>`).join("");
    input = `<select id="${fid}" data-k="${k}"><option value="">Selecione…</option>${opcoes}</select>`;
  } else {
    const ehNumero = q.tipo === "number";
    input = `<input type="${ehNumero ? "number" : "text"}" id="${fid}" data-k="${k}" value="${esc(v)}" ${ehNumero ? 'inputmode="numeric"' : ""}>`;
  }
  return `
    <div class="q">
      <label class="t" for="${fid}">${esc(q.t)}</label>
      ${dica}
      ${input}
    </div>`;
}

function rodapeFicha(i) {
  const ultima = i === SECOES.length - 1;
  const proximo = ultima
    ? `<button class="btn prim" type="button" id="enviar">Enviar diagnóstico</button>`
    : `<button class="btn prim" type="button" data-nav="1">Próximo: ${esc(SECOES[i + 1].curto)} →</button>`;
  return `
    <div class="rodape-ficha">
      <button class="btn" type="button" data-nav="-1" ${i === 0 ? "disabled" : ""}>← Anterior</button>
      ${proximo}
    </div>
    ${ultima ? '<div class="msg" id="msgEnvio" role="status"></div>' : ""}`;
}

function montarFicha() {
  $("#ficha").innerHTML = SECOES.map((s, i) => `
    <div class="sec" data-i="${i}" ${i === atual ? "" : "hidden"}>
      <div class="ficha-top">
        <span class="eyebrow">Departamento ${String(i + 1).padStart(2, "0")} de ${SECOES.length}</span>
        <h2>${esc(s.t)}</h2>
        <p>${esc(s.intro)}</p>
      </div>
      <div class="perguntas">${s.qs.map(q => campo(s, q)).join("")}</div>
      ${rodapeFicha(i)}
    </div>`).join("");
}

function montarTrilho() {
  const nav = $("#trilho");
  nav.querySelectorAll(".dep").forEach(e => e.remove());

  SECOES.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "dep";
    b.dataset.i = i;
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, "0")}</span><span>${esc(s.curto)}</span><span class="c"></span>`;
    nav.appendChild(b);
  });

  atualizarProg();
}

function atualizarProg() {
  document.querySelectorAll(".dep").forEach(b => {
    const s = SECOES[b.dataset.i];
    const c = contSec(s);
    const el = b.querySelector(".c");
    el.textContent = c + "/" + s.qs.length;
    el.classList.toggle("full", c === s.qs.length);
    b.setAttribute("aria-current", String(+b.dataset.i === atual));
  });

  const p = progresso();
  $("#progTxt").textContent = p + "% preenchido";
  $("#progBar").style.width = p + "%";
}

function irPara(i) {
  atual = Math.max(0, Math.min(SECOES.length - 1, i));
  document.querySelectorAll(".sec").forEach(e => e.hidden = +e.dataset.i !== atual);
  atualizarProg();

  const reduzido = matchMedia("(prefers-reduced-motion: reduce)").matches;
  $("#ficha").scrollIntoView({ behavior: reduzido ? "auto" : "smooth", block: "start" });
}

/** Chamado a cada edição: atualiza progresso, guarda local e agenda o salvamento remoto. */
function mudou() {
  atualizarProg();
  salvarLocal();
  if (db && uid && podeGravar) {
    status("Alterações não salvas…", "busy");
    clearTimeout(timer);
    timer = setTimeout(salvar, 1200);
  }
}


/* =========================================================
   4. SALVAMENTO E ENVIO
   ========================================================= */

function docRemoto() {
  return {
    nome: st.respostas["empresa.nome"] || "",
    empresa: st.respostas["empresa.empresa"] || "",
    status: st.status,
    progresso: progresso(),
    atualizadoEm: new Date().toISOString(),
    enviadoEm: st.enviadoEm || null,
    respostas: st.respostas
  };
}

async function salvar() {
  if (!db || !uid || !podeGravar) return false;
  if (salvando) { pendente = true; return false; }

  salvando = true;
  status("Salvando…", "busy");
  let ok = false;

  try {
    await db.doc("respostas/" + uid).set(docRemoto());
    ok = true;
    status("Salvo às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }), "ok");
  } catch (err) {
    if (err && (err.code === "invalid_argument" || err.code === "not_granted")) {
      podeGravar = false;
      semPermissao();
    } else if (err && err.code === "unavailable") {
      status("Sem conexão, tentando de novo…", "err");
      setTimeout(salvar, 2500 + Math.random() * 1500);
    } else {
      status("Não foi possível salvar", "err");
    }
  }

  salvando = false;
  if (pendente) { pendente = false; return salvar(); }
  return ok;
}

function semPermissao() {
  status("Salvo só neste navegador", "err");
  const a = $("#avisoLocal");
  a.hidden = false;
  a.textContent = "Suas respostas estão guardadas apenas neste navegador e ainda não chegam ao seu mentor. Peça a ele um convite por e-mail para este formulário e abra pelo link do convite.";
}

async function enviar() {
  const m = $("#msgEnvio");
  m.className = "msg";

  if (!preenchido(st.respostas["empresa.nome"]) || !preenchido(st.respostas["empresa.empresa"])) {
    m.className = "msg err";
    m.textContent = "Preencha seu nome e o nome da oficina no departamento 01 antes de enviar.";
    return;
  }
  if (!db || !uid || !podeGravar) {
    m.className = "msg err";
    m.textContent = "O envio não está disponível neste acesso. Abra o formulário pelo convite que o seu mentor enviou por e-mail.";
    return;
  }

  const antes = { status: st.status, enviadoEm: st.enviadoEm };
  st.status = "enviado";
  st.enviadoEm = new Date().toISOString();
  clearTimeout(timer);

  const ok = await salvar();
  if (ok) {
    salvarLocal();
    m.className = "msg ok";
    m.textContent = `Diagnóstico enviado com ${progresso()}% preenchido. Você pode voltar e completar as respostas quando quiser; tudo continua sendo salvo automaticamente.`;
  } else {
    Object.assign(st, antes);
    if (!m.textContent) {
      m.className = "msg err";
      m.textContent = "O envio não foi concluído. Verifique a conexão e tente de novo.";
    }
  }
}


/* =========================================================
   5. PAINEL DO MENTOR
   ========================================================= */

function corNota(v) {
  if (v === undefined || v === null || v === "") return "v";
  return v < 4 ? "b" : v < 7 ? "w" : "g";
}

function dataBR(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}

function fmt(v) {
  return Array.isArray(v) ? v.join(", ") : String(v);
}

/** Gráfico radar (SVG) com as notas de autoavaliação por área. */
function radar(resp) {
  const n = AREAS_RADAR.length, cx = 210, cy = 190, R = 130;
  const pt = (i, r) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  };
  const poligono = r => AREAS_RADAR.map((_, i) => pt(i, r).join(",")).join(" ");
  let g = "";

  // Anéis de referência (2, 4, 6, 8, 10)
  [2, 4, 6, 8, 10].forEach(v => {
    g += `<polygon points="${poligono(R * v / 10)}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  });

  // Eixos e rótulos
  AREAS_RADAR.forEach((s, i) => {
    const [x, y] = pt(i, R);
    g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const [lx, ly] = pt(i, R + 22);
    const ancora = Math.abs(lx - cx) < 8 ? "middle" : lx > cx ? "start" : "end";
    g += `<text x="${lx}" y="${ly + 4}" text-anchor="${ancora}" font-size="11" fill="var(--muted)" font-family="var(--f-body)">${esc(s.curto)}</text>`;
  });

  // Área das notas
  const vals = AREAS_RADAR.map(s => {
    const v = resp[s.id + ".nota"];
    return typeof v === "number" ? v : 0;
  });
  g += `<polygon points="${vals.map((v, i) => pt(i, R * v / 10).join(",")).join(" ")}" fill="var(--accent)" fill-opacity=".25" stroke="var(--accent)" stroke-width="2"/>`;
  vals.forEach((v, i) => {
    const [x, y] = pt(i, R * v / 10);
    g += `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--accent)"/>`;
  });

  // Marcas de escala
  g += `<text x="${cx + 4}" y="${cy - R * 0.5 - 2}" font-size="9" fill="var(--muted)" font-family="var(--f-mono)">5</text>`;
  g += `<text x="${cx + 4}" y="${cy - R - 2}" font-size="9" fill="var(--muted)" font-family="var(--f-mono)">10</text>`;

  return `<svg viewBox="0 0 420 380" role="img" aria-label="Radar das notas de autoavaliação por área">${g}</svg>`;
}

function renderPainel() {
  const P = $("#vistaPainel");

  if (selecionado) {
    const r = lista.find(x => x.id === selecionado);
    if (r) { renderDetalhe(P, r); return; }
    selecionado = null;
  }

  const enviados = lista.filter(x => x.status === "enviado").length;

  const cabecalho = AREAS_RADAR
    .map(s => `<th class="num" title="${esc(s.t)}">${esc(s.curto)}</th>`)
    .join("");

  const celulaNota = v =>
    `<td class="num"><span class="cel ${corNota(v)}">${typeof v === "number" ? v : "–"}</span></td>`;

  const linhas = lista.map(r => {
    const rs = r.respostas || {};
    const enviado = r.status === "enviado";
    return `
      <tr class="linha" data-id="${esc(r.id)}" tabindex="0">
        <td><b>${esc(r.empresa || "Sem nome da oficina")}</b><small>${esc(r.nome || "—")}</small></td>
        <td><span class="pill ${enviado ? "env" : "ras"}">${enviado ? "Enviado" : "Em andamento"}</span></td>
        <td class="num">${r.progresso ?? 0}%</td>
        ${AREAS_RADAR.map(s => celulaNota(rs[s.id + ".nota"])).join("")}
        <td class="num num-pequeno">${dataBR(r.atualizadoEm)}</td>
      </tr>`;
  }).join("");

  const medias = AREAS_RADAR.map(s => {
    const v = lista.map(r => (r.respostas || {})[s.id + ".nota"]).filter(x => typeof x === "number");
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
  });

  const linhaMedia = lista.length ? `
    <tr>
      <td><b>Média da turma</b></td><td></td><td></td>
      ${medias.map(m => `<td class="num"><span class="cel ${corNota(m)}">${m === null ? "–" : m.toFixed(1).replace(".", ",")}</span></td>`).join("")}
      <td></td>
    </tr>` : "";

  const tabela = lista.length ? `
    <div class="rolar">
      <table>
        <thead><tr><th>Oficina / responsável</th><th>Status</th><th class="num">Preench.</th>${cabecalho}<th class="num">Atualizado</th></tr></thead>
        <tbody>${linhas}${linhaMedia}</tbody>
      </table>
    </div>` : `
    <div class="vazio">Nenhuma resposta ainda. Assim que um mentorado começar a preencher, ele aparece aqui, com as respostas salvas em tempo real.</div>`;

  P.innerHTML = `
    <div class="resumo">
      <div class="kpi"><b>${lista.length}</b><span>Mentorados que começaram</span></div>
      <div class="kpi"><b>${enviados}</b><span>Diagnósticos enviados</span></div>
      <div class="kpi"><b>${lista.length - enviados}</b><span>Ainda preenchendo</span></div>
      <div class="resumo-acao">
        <button class="btn steel" type="button" id="exportar" ${lista.length ? "" : "disabled"}>Exportar planilha (CSV)</button>
      </div>
    </div>
    <div class="msg" id="msgExport" role="status"></div>
    <div class="bloco">
      <h3>Mapa de autoavaliação</h3>
      <p>Nota de 0 a 10 que cada dono deu para a própria área. Vermelho abaixo de 4, amarelo de 4 a 6, verde a partir de 7. Clique numa linha para ler o diagnóstico completo.</p>
      ${tabela}
    </div>`;
}

function renderDetalhe(P, r) {
  const rs = r.respostas || {};

  const secoes = SECOES.map(s => `
    <div class="resp-sec">
      <h4>${esc(s.t)}</h4>
      ${s.qs.map(q => {
        const v = rs[key(s, q)];
        const tem = preenchido(v);
        return `
        <div class="resp">
          <div class="p">${esc(q.t)}</div>
          <div class="a ${tem ? "" : "vz"}">${tem ? esc(fmt(v)) : "Sem resposta"}</div>
        </div>`;
      }).join("")}
    </div>`).join("");

  const situacao = r.status === "enviado" ? "Enviado em " + dataBR(r.enviadoEm) : "Em andamento";
  const subtitulo = esc(r.nome || "—")
    + (rs["empresa.cargo"] ? " · " + esc(rs["empresa.cargo"]) : "")
    + (rs["empresa.cidade"] ? " · " + esc(rs["empresa.cidade"]) : "");

  P.innerHTML = `
    <div><button class="btn" type="button" id="voltar">← Todos os mentorados</button></div>
    <div class="bloco">
      <div class="detalhe-top">
        <div class="detalhe-id">
          <span class="eyebrow">${situacao} · ${r.progresso ?? 0}% preenchido</span>
          <h3>${esc(r.empresa || "Sem nome da oficina")}</h3>
          <p>${subtitulo}</p>
        </div>
        <div class="radar">${radar(rs)}</div>
      </div>
      ${secoes}
    </div>`;
}

async function exportar() {
  const m = $("#msgExport");
  m.className = "msg";
  m.textContent = "";

  const cols = [
    ["Oficina", r => r.empresa],
    ["Responsável", r => r.nome],
    ["Status", r => r.status === "enviado" ? "Enviado" : "Em andamento"],
    ["% preenchido", r => r.progresso],
    ["Atualizado em", r => dataBR(r.atualizadoEm)]
  ];
  SECOES.forEach(s => s.qs.forEach(q => {
    cols.push([s.curto + " | " + q.t, r => {
      const v = (r.respostas || {})[key(s, q)];
      return preenchido(v) ? fmt(v) : "";
    }]);
  }));

  const cel = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const csv = "﻿" + [
    cols.map(c => cel(c[0])).join(";"),
    ...lista.map(r => cols.map(c => cel(c[1](r))).join(";"))
  ].join("\r\n");

  const dl = window.claude?.use ? await claude.use("downloads") : null;
  if (!dl) {
    m.className = "msg err";
    m.textContent = "A exportação não está disponível nesta visualização.";
    return;
  }

  try {
    await dl.save({ filename: "diagnostico-360-mentorados.csv", data: csv });
    m.className = "msg ok";
    m.textContent = "Planilha gerada.";
  } catch (err) {
    if (err && err.code === "declined") return;
    m.className = "msg err";
    m.textContent = "Não foi possível gerar a planilha. Tente novamente em alguns segundos.";
  }
}

function mostrarAba(painel) {
  $("#abaForm").setAttribute("aria-selected", String(!painel));
  $("#abaPainel").setAttribute("aria-selected", String(painel));
  $("#vistaForm").hidden = painel;
  $("#vistaPainel").hidden = !painel;
  $("#avisoDono").hidden = painel;
}


/* =========================================================
   6. EVENTOS
   ========================================================= */

document.addEventListener("click", e => {
  const alvo = e.target;

  // Formulário
  const dep = alvo.closest(".dep");
  if (dep) { irPara(+dep.dataset.i); return; }

  const nav = alvo.closest("[data-nav]");
  if (nav) { irPara(atual + +nav.dataset.nav); return; }

  const nota = alvo.closest(".escala button");
  if (nota) {
    st.respostas[nota.dataset.k] = +nota.dataset.v;
    nota.parentElement.querySelectorAll("button")
      .forEach(x => x.setAttribute("aria-pressed", String(x === nota)));
    mudou();
    return;
  }

  if (alvo.id === "enviar") { enviar(); return; }

  // Painel do mentor
  const linha = alvo.closest("tr.linha");
  if (linha) {
    selecionado = linha.dataset.id;
    renderPainel();
    window.scrollTo(0, 0);
    return;
  }

  if (alvo.id === "voltar")   { selecionado = null; renderPainel(); return; }
  if (alvo.id === "exportar") { exportar(); return; }
  if (alvo.id === "abaForm" || alvo.id === "abaPainel") mostrarAba(alvo.id === "abaPainel");
});

document.addEventListener("input", e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.k || !el.closest("#ficha")) return;

  const k = el.dataset.k;
  if (el.type === "checkbox") {
    st.respostas[k] = [...document.querySelectorAll(`input[type=checkbox][data-k="${k}"]:checked`)].map(x => x.value);
  } else {
    st.respostas[k] = el.value;
  }
  mudou();
});

// Linhas da tabela acessíveis por teclado
document.addEventListener("keydown", e => {
  const linha = e.target.closest && e.target.closest("tr.linha");
  if (linha && (e.key === "Enter" || e.key === " ")) {
    e.preventDefault();
    linha.click();
  }
});


/* =========================================================
   7. INICIALIZAÇÃO
   ========================================================= */

montarFicha();
montarTrilho();

(async () => {
  if (!window.claude || !window.claude.use) {
    status("Salvo só neste navegador", "err");
    return;
  }

  const [u, d] = await Promise.all([claude.use("user"), claude.use("db")]);
  if (u) {
    try { uid = await u.id(); } catch (e) {}
    try { souDono = await u.isOwner(); } catch (e) {}
  }
  if (!d || !uid) {
    db = null;
    semPermissao();
    return;
  }
  db = d;

  // Carrega as respostas já salvas deste usuário
  try {
    const snap = await db.doc("respostas/" + uid).get();
    if (snap.exists) {
      const r = snap.data();
      st = { respostas: { ...(r.respostas || {}) }, status: r.status || "rascunho", enviadoEm: r.enviadoEm || null };
      salvarLocal();
      montarFicha();
      montarTrilho();
      status("Respostas carregadas", "ok");
    } else if (Object.keys(st.respostas).length) {
      await salvar();   // sobe o rascunho que estava só no navegador
    } else {
      status("Pronto · salvamento automático", "ok");
    }
  } catch (e) {
    status("Sem conexão com o servidor", "err");
  }

  // Dono: abas + painel em tempo real
  if (souDono) {
    $("#abas").hidden = false;
    $("#avisoDono").hidden = false;
    renderPainel();

    db.collection("respostas").onSnapshot(
      q => {
        lista = q.docs
          .map(x => ({ id: x.id, ...x.data() }))
          .sort((a, b) => String(b.atualizadoEm || "").localeCompare(String(a.atualizadoEm || "")));
        renderPainel();
      },
      () => {
        $("#vistaPainel").innerHTML = '<div class="bloco"><div class="vazio">Não foi possível carregar as respostas. Recarregue a página.</div></div>';
      }
    );
  }
})();
</script>
